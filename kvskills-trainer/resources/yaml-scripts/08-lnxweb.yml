---
- name: 08-lnxweb.yml
  hosts: LNX2
  gather_facts: false
  tasks:
  - name: Install apache httpd  (state=present is optional)
    ansible.builtin.apt:
      name: apache2
      state: present

  - name: Create directory
    ansible.builtin.file:
      path: /cert
      state: directory

  - name: copy required certificate
    ansible.builtin.copy:
      src: /data/ansible/cert/
      dest: /cert

  - name: copy default-ssl.conf
    ansible.builtin.copy:
      src: /data/ansible/web/default-ssl.conf
      dest: /etc/apache2/sites-available/default-ssl.conf

  - name: copy index.html
    ansible.builtin.copy:
      src: /data/ansible/web/index.html
      dest: /var/www/html/index.html

  - ansible.builtin.shell: a2enmod ssl 
  - ansible.builtin.shell: a2ensite default-ssl.conf

  - name: Restart Apache2 Service
    ansible.builtin.service:
      name: apache2
      state: restarted
 
   - name: reboot
    ansible.builtin.reboot: