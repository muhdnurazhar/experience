---
- name: 01-hostname
  hosts: WIN2
  gather_facts: false
  tasks: 
  - name: change windows hostname
    ansible.windows.win_hostname:
      name: "{{hostname}}"
    register: res
  - name: Reboot
    ansible.windows.win_reboot:
    when: res.reboot_required
    
- name: 01-hostname
  hosts: LNX2
  gather_facts: false
  tasks: 
  - name: Set a hostname
    ansible.builtin.hostname:
      name: LNX2
  - name: replace hosts file
    ansible.builtin.lineinfile:
      path: /etc/hosts
      regexp: '^127\.0\.0\.1'
      line: 127.0.0.1 LNX2.itnsa.my LNX2

  - name: reboot
    ansible.builtin.reboot:

- name: 01-hostname
  hosts: RTR1 RTR2 SW3
  gather_facts: false
  tasks: 
  - name: hostname and domain
    cisco.ios.ios_config:
      lines: 
        - hostname {{hostname}}
        - ip domain-name KVSkills.my
  
  - name: pasword line console 0
    cisco.ios.ios_config: 
      lines: 
        - login local
      parents: line console 0  

    